
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Noval | Network Engineer Portfolio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

:root {
    --primary: #00b4ff;
    --background: #07111f;
    --card: #101f33;
    --text: #a8b8cc;
    --white: #ffffff;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--background);
    color: var(--white);
    line-height: 1.7;
}

.container {
    width: 88%;
    max-width: 1150px;
    margin: auto;
}

/* NAVBAR */
header {
    background: rgba(7,17,31,.95);
    border-bottom: 1px solid #1d3048;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    color: var(--primary);
}

.logo span {
    color: white;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 28px;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 14px;
    transition: .3s;
}

nav a:hover {
    color: var(--primary);
}

/* HERO */
.hero {
    min-height: 88vh;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
    background:
    radial-gradient(circle at 85% 45%, #06365b 0%, transparent 35%);
}

.hero-content {
    max-width: 700px;
    position: relative;
    z-index: 2;
}

.tag {
    display: inline-block;
    color: var(--primary);
    border: 1px solid var(--primary);
    padding: 6px 16px;
    border-radius: 30px;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.hero h1 {
    font-size: clamp(38px, 6vw, 68px);
    line-height: 1.15;
    margin-bottom: 20px;
}

.hero h1 span {
    color: var(--primary);
}

.hero p {
    color: var(--text);
    font-size: 16px;
    max-width: 590px;
    margin-bottom: 30px;
}

.btn {
    display: inline-block;
    background: var(--primary);
    color: #00101c;
    padding: 12px 25px;
    border-radius: 6px;
    font-weight: bold;
    text-decoration: none;
    transition: .3s;
}

.btn:hover {
    background: white;
    transform: translateY(-4px);
}

.hero-graphic {
    position: absolute;
    right: 5%;
    width: 350px;
    opacity: .45;
}

/* SECTIONS */
section {
    padding: 85px 0;
}

.section-title {
    font-size: 34px;
    margin-bottom: 10px;
}
